<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, Arial, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; text-align: center; }
.box { max-width: 600px; }
h1 { font-size: 6rem; font-weight: 900; margin-bottom: 10px; }
h2 { font-size: 1.8rem; margin-bottom: 15px; }
p { font-size: 1.05rem; opacity: 0.9; margin-bottom: 30px; }
a { display: inline-block; background: white; color: #667eea; padding: 14px 30px; border-radius: 10px; text-decoration: none; font-weight: 800; font-size: 1rem; transition: all 0.25s; }
a:hover { transform: translateY(-3px); box-shadow: 0 15px 35px rgba(0,0,0,0.3); }
</style>
</head>
<body>
<div class="box">
    <h1>404</h1>
    <h2>Oops! Page Not Found</h2>

</div>
