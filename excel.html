<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Excel Formula Generator - PDF & CSV Download | FreeToolsIndia</title>
    <meta name="description" content="Generate Excel formulas instantly. Download results as PDF or CSV. All 20 essential Excel functions - SUM, VLOOKUP, IF, and more.">
    <meta name="keywords" content="excel formula generator, excel functions, download formula PDF, CSV export, free excel tool">
    <meta name="robots" content="index, follow">
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- jsPDF for PDF download -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- html2canvas for PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #6366f1;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .header p {
            color: #6b7280;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .tab {
            padding: 10px 20px;
            background: #f3f4f6;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            font-size: 14px;
        }

        .tab.active {
            background: linear-gradient(45deg, #6366f1, #8b5cf6);
            color: white;
        }

        .function-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 10px;
            margin-bottom: 30px;
        }

        .function-btn {
            padding: 15px;
            background: #f9fafb;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.3s;
            text-align: center;
        }

        .function-btn:hover {
            border-color: #6366f1;
            background: #eef2ff;
            transform: translateY(-3px);
        }

        .function-btn.selected {
            background: #6366f1;
            color: white;
            border-color: #6366f1;
        }

        .input-section {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
        }

        textarea {
            width: 100%;
            padding: 12px 15px;
            font-size: 16px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            margin-bottom: 15px;
            resize: vertical;
        }

        .btn {
            background: linear-gradient(45deg, #6366f1, #8b5cf6);
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: transform 0.3s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #result {
            padding: 20px;
            background: #f9fafb;
            border-radius: 10px;
            white-space: pre-wrap;
            line-height: 1.8;
            display: none;
            margin-top: 20px;
            border-left: 4px solid #6366f1;
        }

        .download-btns {
            display: none;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .download-btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .download-pdf {
            background: #ef4444;
            color: white;
        }

        .download-csv {
            background: #10b981;
            color: white;
        }

        .download-txt {
            background: #6366f1;
            color: white;
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .loading {
            text-align: center;
            color: #6366f1;
            display: none;
            margin: 20px 0;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #6366f1;
            text-decoration: none;
            font-weight: 500;
        }

        .formula-preview {
            background: #1f2937;
            color: #10b981;
            padding: 15px;
            border-radius: 10px;
            font-family: monospace;
            font-size: 14px;
            margin-bottom: 15px;
            display: none;
        }

        .quick-examples {
            margin-top: 30px;
            padding: 20px;
            background: #f0f4ff;
            border-radius: 10px;
        }

        .quick-examples h3 {
            color: #6366f1;
            margin-bottom: 15px;
        }

        .example-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 10px;
        }

        .example-item {
            padding: 10px;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .example-item:hover {
            background: #e0e7ff;
            transform: translateX(5px);
        }

        .toast {
            display: none;
            position: fixed;
            top: 20px;
            right: 20px;
            background: #10b981;
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            font-weight: 600;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Free Excel Formula Generator</h1>
            <p>Generate & Download Formulas - PDF, CSV, TXT</p>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab active" onclick="switchTab('basic', this)">Basic Functions</button>
            <button class="tab" onclick="switchTab('logical', this)">Logical</button>
            <button class="tab" onclick="switchTab('lookup', this)">Lookup</button>
            <button class="tab" onclick="switchTab('text', this)">Text</button>
            <button class="tab" onclick="switchTab('date', this)">Date & Time</button>
        </div>

        <!-- Function Buttons -->
        <div class="function-grid" id="functionGrid"></div>

        <!-- Input Section -->
        <div class="input-section">
            <label>Selected Function: <span id="selectedFunction">None</span></label>
            <textarea id="requirement" rows="4" placeholder="Describe your requirement... Example: Sum of sales in column A from row 1 to 10"></textarea>
        </div>

        <div class="formula-preview" id="formulaPreview"></div>

        <button class="btn" id="generateBtn" onclick="generateFormula()">🚀 Generate Formula</button>

        <div class="loading" id="loading">⏳ Generating formula with AI...</div>

        <div id="result"></div>

        <!-- Download Buttons -->
        <div class="download-btns" id="downloadBtns">
            <button class="download-btn download-pdf" onclick="downloadPDF()">
                📄 Download PDF
            </button>
            <button class="download-btn download-csv" onclick="downloadCSV()">
                📊 Download CSV
            </button>
            <button class="download-btn download-txt" onclick="downloadTXT()">
                📝 Download TXT
            </button>
        </div>

        <a href="index.html" class="back-link">← Back to All Tools</a>

        <!-- Quick Examples -->
        <div class="quick-examples">
            <h3>💡 Quick Examples (Click to Use):</h3>
            <div class="example-grid">
                <div class="example-item" onclick="fillExample('SUM', 'Total sales in column B from row 2 to 20')">Sum of sales column</div>
                <div class="example-item" onclick="fillExample('AVERAGE', 'Average marks of students in row 2 to 50')">Average marks</div>
                <div class="example-item" onclick="fillExample('VLOOKUP', 'Find employee name from ID in table A1:D100')">VLOOKUP employee</div>
                <div class="example-item" onclick="fillExample('IF', 'If sales > 10000 then bonus else no bonus')">IF condition bonus</div>
                <div class="example-item" onclick="fillExample('COUNTIF', 'Count cells greater than 500 in column C')">Count values > 500</div>
                <div class="example-item" onclick="fillExample('SUMIF', 'Sum of amount where category is Food')">SUMIF category sum</div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast">✅ Downloaded Successfully!</div>

    <script src="config.js"></script>
    <script>
        // All 20 Excel Functions Data
        const excelFunctions = {
            basic: [
                { name: 'SUM', category: 'basic', icon: '➕' },
                { name: 'AVERAGE', category: 'basic', icon: '📊' },
                { name: 'COUNT', category: 'basic', icon: '🔢' },
                { name: 'COUNTA', category: 'basic', icon: '📝' },
                { name: 'MAX', category: 'basic', icon: '⬆️' },
                { name: 'MIN', category: 'basic', icon: '⬇️' }
            ],
            logical: [
                { name: 'IF', category: 'logical', icon: '🔀' },
                { name: 'AND', category: 'logical', icon: '✅' },
                { name: 'OR', category: 'logical', icon: '🔗' },
                { name: 'IFERROR', category: 'logical', icon: '🛡️' },
                { name: 'ISNUMBER', category: 'logical', icon: '🔍' },
                { name: 'ISTEXT', category: 'logical', icon: '📄' }
            ],
            lookup: [
                { name: 'VLOOKUP', category: 'lookup', icon: '🔎' },
                { name: 'XLOOKUP', category: 'lookup', icon: '🔍' },
                { name: 'INDEX', category: 'lookup', icon: '📑' },
                { name: 'MATCH', category: 'lookup', icon: '🎯' }
            ],
            text: [
                { name: 'LEFT', category: 'text', icon: '⬅️' },
                { name: 'RIGHT', category: 'text', icon: '➡️' },
                { name: 'MID', category: 'text', icon: '↔️' },
                { name: 'UPPER', category: 'text', icon: '🔠' },
                { name: 'LOWER', category: 'text', icon: '🔡' },
                { name: 'PROPER', category: 'text', icon: '✏️' },
                { name: 'CONCATENATE', category: 'text', icon: '🔗' },
                { name: 'TEXTJOIN', category: 'text', icon: '📝' },
                { name: 'TRIM', category: 'text', icon: '✂️' },
                { name: 'LEN', category: 'text', icon: '📏' }
            ],
            date: [
                { name: 'TODAY', category: 'date', icon: '📅' },
                { name: 'NOW', category: 'date', icon: '⏰' },
                { name: 'DAY', category: 'date', icon: '☀️' },
                { name: 'MONTH', category: 'date', icon: '🌙' },
                { name: 'YEAR', category: 'date', icon: '📆' },
                { name: 'DATEDIF', category: 'date', icon: '⏳' }
            ]
        };

        let currentCategory = 'basic';
        let selectedFunction = null;
        let lastResult = '';

        // Load functions
        function switchTab(category, element) {
            currentCategory = category;
            
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            element.classList.add('active');
            
            loadFunctions(category);
        }

        function loadFunctions(category) {
            const grid = document.getElementById('functionGrid');
            grid.innerHTML = '';
            
            excelFunctions[category].forEach(func => {
                const btn = document.createElement('button');
                btn.className = 'function-btn';
                btn.innerHTML = `${func.icon} ${func.name}`;
                btn.onclick = function() {
                    selectFunction(func.name, this);
                };
                grid.appendChild(btn);
            });
        }

        function selectFunction(name, element) {
            selectedFunction = name;
            
            document.querySelectorAll('.function-btn').forEach(btn => {
                btn.classList.remove('selected');
            });
            element.classList.add('selected');
            
            document.getElementById('selectedFunction').textContent = name;
            document.getElementById('selectedFunction').style.color = '#6366f1';
            document.getElementById('selectedFunction').style.fontWeight = 'bold';
            
            const examples = {
                'SUM': 'Total of values in range',
                'AVERAGE': 'Average of values',
                'COUNT': 'Count numbers in range',
                'COUNTA': 'Count non-empty cells',
                'MAX': 'Maximum value',
                'MIN': 'Minimum value',
                'IF': 'If condition true then value1 else value2',
                'AND': 'Check multiple conditions',
                'OR': 'Check if any condition is true',
                'IFERROR': 'Handle errors in formula',
                'VLOOKUP': 'Find value in table',
                'XLOOKUP': 'Modern lookup function',
                'CONCATENATE': 'Join text strings',
                'TEXTJOIN': 'Join with delimiter',
                'LEFT': 'Extract from left side',
                'RIGHT': 'Extract from right side',
                'MID': 'Extract from middle',
                'UPPER': 'Convert to uppercase',
                'LOWER': 'Convert to lowercase',
                'PROPER': 'Capitalize first letter',
                'TRIM': 'Remove extra spaces',
                'LEN': 'Count characters',
                'TODAY': 'Current date',
                'NOW': 'Current date and time',
                'DAY': 'Extract day from date',
                'MONTH': 'Extract month from date',
                'YEAR': 'Extract year from date',
                'DATEDIF': 'Difference between dates'
            };
            
            document.getElementById('requirement').placeholder = 
                `Example: ${examples[name] || 'Describe your requirement'}`;
            
            showFormulaPreview(name);
        }

        function showFormulaPreview(functionName) {
            const syntaxes = {
                'SUM': '=SUM(number1, [number2], ...)',
                'AVERAGE': '=AVERAGE(number1, [number2], ...)',
                'COUNT': '=COUNT(value1, [value2], ...)',
                'COUNTA': '=COUNTA(value1, [value2], ...)',
                'MAX': '=MAX(number1, [number2], ...)',
                'MIN': '=MIN(number1, [number2], ...)',
                'IF': '=IF(logical_test, value_if_true, value_if_false)',
                'AND': '=AND(logical1, [logical2], ...)',
                'OR': '=OR(logical1, [logical2], ...)',
                'IFERROR': '=IFERROR(value, value_if_error)',
                'ISNUMBER': '=ISNUMBER(value)',
                'ISTEXT': '=ISTEXT(value)',
                'VLOOKUP': '=VLOOKUP(lookup_value, table_array, col_index, [range_lookup])',
                'XLOOKUP': '=XLOOKUP(lookup_value, lookup_array, return_array)',
                'INDEX': '=INDEX(array, row_num, [column_num])',
                'MATCH': '=MATCH(lookup_value, lookup_array, [match_type])',
                'LEFT': '=LEFT(text, [num_chars])',
                'RIGHT': '=RIGHT(text, [num_chars])',
                'MID': '=MID(text, start_num, num_chars)',
                'UPPER': '=UPPER(text)',
                'LOWER': '=LOWER(text)',
                'PROPER': '=PROPER(text)',
                'CONCATENATE': '=CONCATENATE(text1, [text2], ...)',
                'TEXTJOIN': '=TEXTJOIN(delimiter, ignore_empty, text1, [text2], ...)',
                'TRIM': '=TRIM(text)',
                'LEN': '=LEN(text)',
                'TODAY': '=TODAY()',
                'NOW': '=NOW()',
                'DAY': '=DAY(serial_number)',
                'MONTH': '=MONTH(serial_number)',
                'YEAR': '=YEAR(serial_number)',
                'DATEDIF': '=DATEDIF(start_date, end_date, unit)'
            };
            
            const preview = document.getElementById('formulaPreview');
            if (syntaxes[functionName]) {
                preview.innerHTML = `<strong>Syntax:</strong> ${syntaxes[functionName]}`;
                preview.style.display = 'block';
            }
        }

        function fillExample(functionName, description) {
            selectedFunction = functionName;
            document.getElementById('selectedFunction').textContent = functionName;
            document.getElementById('requirement').value = description;
            
            document.querySelectorAll('.function-btn').forEach(btn => {
                if (btn.textContent.includes(functionName)) {
                    btn.classList.add('selected');
                }
            });
            
            showFormulaPreview(functionName);
        }

        async function generateFormula() {
            var requirement = document.getElementById('requirement').value;
            var result = document.getElementById('result');
            var loading = document.getElementById('loading');
            var btn = document.getElementById('generateBtn');
            var downloadBtns = document.getElementById('downloadBtns');

            if (!selectedFunction && !requirement) {
                alert('Please select a function or describe your requirement.');
                return;
            }

            if (!requirement) {
                alert('Please describe what you want to calculate.');
                return;
            }

            btn.disabled = true;
            loading.style.display = 'block';
            result.style.display = 'none';
            downloadBtns.style.display = 'none';

            var prompt = `Generate Excel formula using ${selectedFunction || 'appropriate'} function.
            
            User requirement: ${requirement}
            
            Provide in this format:
            FORMULA: [complete formula]
            EXPLANATION: [step-by-step explanation]
            EXAMPLE: [practical example with sample data]
            TIPS: [any useful tips]`;

            try {
                var response = await fetch(CONFIG.GROQ_API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + CONFIG.GROQ_API_KEY
                    },
                    body: JSON.stringify({
                        model: CONFIG.GROQ_MODEL,
                        messages: [
                            {
                                role: 'system',
                                content: 'You are an Excel expert. Provide accurate formulas with clear explanations.'
                            },
                            {
                                role: 'user',
                                content: prompt
                            }
                        ],
                        max_tokens: CONFIG.MAX_TOKENS,
                        temperature: CONFIG.TEMPERATURE
                    })
                });

                var data = await response.json();

                if (data.choices && data.choices[0]) {
                    lastResult = data.choices[0].message.content;
                    result.innerHTML = '<strong>✅ Generated Formula:</strong><br><br>' + 
                        lastResult.replace(/\n/g, '<br>');
                    result.style.display = 'block';
                    downloadBtns.style.display = 'flex';
                } else {
                    result.innerHTML = '❌ Error: ' + JSON.stringify(data);
                    result.style.display = 'block';
                }

            } catch (error) {
                result.innerHTML = '❌ Error: ' + error.message;
                result.style.display = 'block';
            } finally {
                btn.disabled = false;
                loading.style.display = 'none';
            }
        }

        // Download as PDF
        function downloadPDF() {
            if (!lastResult) return;
            
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            doc.setFontSize(18);
            doc.text('Excel Formula Generator - Result', 105, 20, { align: 'center' });
            
            doc.setFontSize(10);
            doc.text('Generated by FreeToolsIndia', 105, 28, { align: 'center' });
            
            doc.setFontSize(12);
            doc.text('Function: ' + (selectedFunction || 'Custom'), 20, 40);
            doc.text('Date: ' + new Date().toLocaleString(), 20, 48);
            
            doc.setDrawColor(99, 102, 241);
            doc.line(20, 52, 190, 52);
            
            doc.setFontSize(11);
            const lines = doc.splitTextToSize(lastResult, 170);
            doc.text(lines, 20, 62);
            
            doc.save('excel-formula.pdf');
            showToast();
        }

        // Download as CSV
        function downloadCSV() {
            if (!lastResult) return;
            
            let csv = 'Section,Content\n';
            
            const lines = lastResult.split('\n');
            lines.forEach(line => {
                const cleanLine = line.replace(/,/g, ';');
                csv += `"${cleanLine}"\n`;
            });
            
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'excel-formula.csv';
            link.click();
            showToast();
        }

        // Download as TXT
        function downloadTXT() {
            if (!lastResult) return;
            
            const txt = 'EXCEL FORMULA GENERATOR - RESULT\n';
            const txtContent = txt + '='.repeat(50) + '\n\n' + 
                'Function: ' + (selectedFunction || 'Custom') + '\n' +
                'Date: ' + new Date().toLocaleString() + '\n' +
                '='.repeat(50) + '\n\n' + lastResult;
            
            const blob = new Blob([txtContent], { type: 'text/plain;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'excel-formula.txt';
            link.click();
            showToast();
        }

        // Show toast notification
        function showToast() {
            const toast = document.getElementById('toast');
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 2000);
        }

        // Load basic functions on page load
        window.onload = function() {
            loadFunctions('basic');
        };
    </script>
</body>
</html>
