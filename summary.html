<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free AI Summary Generator - Summarize Text Online | FreeToolsIndia</title>
    <meta name="description" content="Free AI-powered summary generator. Summarize any long text into 5 key points instantly. No signup required.">
    <meta name="keywords" content="summary generator, AI summary, text summarizer, free summary tool">
    <meta name="robots" content="index, follow">
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #6366f1;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .header p {
            color: #6b7280;
        }

        textarea {
            width: 100%;
            height: 250px;
            padding: 15px;
            font-size: 16px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            resize: vertical;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #6366f1;
        }

        .btn {
            background: linear-gradient(45deg, #6366f1, #8b5cf6);
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin: 20px 0;
            transition: transform 0.3s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #result {
            padding: 20px;
            background: #f9fafb;
            border-radius: 10px;
            white-space: pre-wrap;
            line-height: 1.6;
            display: none;
        }

        .loading {
            text-align: center;
            color: #6366f1;
            display: none;
            margin: 20px 0;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #6366f1;
            text-decoration: none;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📝 Free AI Summary Generator</h1>
            <p>Paste your long text below and get a concise 5-point summary instantly</p>
        </div>

        <textarea id="inputText" placeholder="Paste your article, document, or any long text here..."></textarea>

        <button class="btn" id="generateBtn" onclick="generateSummary()">Generate Summary</button>

        <div class="loading" id="loading">⏳ Generating summary with AI...</div>

        <div id="result"></div>

        <a href="index.html" class="back-link">← Back to All Tools</a>
    </div>

    <script src="config.js"></script>
    <script>
        async function generateSummary() {
            var text = document.getElementById('inputText').value;
            var result = document.getElementById('result');
            var loading = document.getElementById('loading');
            var btn = document.getElementById('generateBtn');

            if (!text || text.length < 50) {
                alert('Please paste at least 50 characters of text.');
                return;
            }

            btn.disabled = true;
            loading.style.display = 'block';
            result.style.display = 'none';

            try {
                var response = await fetch(CONFIG.GROQ_API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + CONFIG.GROQ_API_KEY
                    },
                    body: JSON.stringify({
                        model: CONFIG.GROQ_MODEL,
                        messages: [
                            {
                                role: 'system',
                                content: 'You are a professional content summarizer. Provide clear and concise summaries.'
                            },
                            {
                                role: 'user',
                                content: 'Summarize this text into exactly 5 key bullet points:\n\n' + text
                            }
                        ],
                        max_tokens: CONFIG.MAX_TOKENS,
                        temperature: CONFIG.TEMPERATURE
                    })
                });

                var data = await response.json();

                if (data.choices && data.choices[0]) {
                    result.innerHTML = '<strong>✅ Summary:</strong><br><br>' + 
                        data.choices[0].message.content.replace(/\n/g, '<br>');
                    result.style.display = 'block';
                } else {
                    result.innerHTML = '❌ Error: ' + JSON.stringify(data);
                    result.style.display = 'block';
                }

            } catch (error) {
                result.innerHTML = '❌ Error: ' + error.message;
                result.style.display = 'block';
            } finally {
                btn.disabled = false;
                loading.style.display = 'none';
            }
        }
    </script>
</body>
</html>
