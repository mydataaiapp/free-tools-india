<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free AI Summary Generator | FreeToolsIndia</title>
    <meta name="description" content="Free AI summary generator. Summarize text into bullet points instantly.">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; border-radius: 15px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: #6366f1; font-size: 2rem; margin-bottom: 10px; }
        .header p { color: #6b7280; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; color: #374151; margin-bottom: 8px; font-size: 14px; }
        select, textarea { width: 100%; padding: 12px 15px; font-size: 15px; border: 2px solid #e5e7eb; border-radius: 8px; }
        textarea { height: 200px; resize: vertical; }
        .btn { background: linear-gradient(45deg, #6366f1, #8b5cf6); color: white; padding: 15px 40px; border: none; border-radius: 10px; font-size: 18px; font-weight: 600; cursor: pointer; width: 100%; margin: 20px 0; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        #result { padding: 25px; background: #f9fafb; border-radius: 10px; white-space: pre-wrap; line-height: 1.8; display: none; margin-top: 20px; }
        .loading { text-align: center; color: #6366f1; display: none; margin: 20px 0; }
        .back-link { display: block; text-align: center; margin-top: 20px; color: #6366f1; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📝 Free AI Summary Generator</h1>
            <p>Summarize Text in 5 Different Formats</p>
        </div>

        <div class="form-group">
            <label>Summary Format</label>
            <select id="summaryFormat">
                <option value="Bullet Points">📌 Bullet Points</option>
                <option value="Paragraph">📄 Paragraph</option>
                <option value="Key Takeaways">🔑 Key Takeaways</option>
                <option value="Executive Summary">📊 Executive Summary</option>
                <option value="One-Liner">✏️ One-Liner</option>
            </select>
        </div>

        <div class="form-group">
            <label>Language</label>
            <select id="language">
                <option value="English">English</option>
                <option value="Hindi">Hindi</option>
                <option value="Hinglish">Hinglish</option>
            </select>
        </div>

        <div class="form-group">
            <label>Paste Your Text</label>
            <textarea id="inputText" placeholder="Paste your article, document, or any long text here..."></textarea>
        </div>

        <button class="btn" id="generateBtn" onclick="generateSummary()">🚀 Generate Summary</button>

        <div class="loading" id="loading">⏳ Generating summary with AI...</div>

        <div id="result"></div>

        <a href="index.html" class="back-link">← Back to Home</a>
    </div>

    <script>
        async function generateSummary() {
            var text = document.getElementById('inputText').value;
            var format = document.getElementById('summaryFormat').value;
            var language = document.getElementById('language').value;
            
            var result = document.getElementById('result');
            var loading = document.getElementById('loading');
            var btn = document.getElementById('generateBtn');

            if (!text || text.length < 50) {
                alert('Please paste at least 50 characters of text.');
                return;
            }

            btn.disabled = true;
            loading.style.display = 'block';
            result.style.display = 'none';

            var prompt = 'Summarize this text in ' + format + ' format in ' + language + ' language:\n\n' + text;

            try {
                // ✅ DIRECT FETCH - No callAI needed
                var response = await fetch('/api/groq', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        prompt: prompt,
                        systemPrompt: 'You are a professional content summarizer.',
                        maxTokens: 1500
                    })
                });
                
                var data = await response.json();
                console.log('API Response:', data);
                
                if (data.choices && data.choices[0]) {
                    var content = data.choices[0].message.content;
                    result.innerHTML = '<strong>✅ Summary:</strong><br><br>' + content.replace(/\n/g, '<br>');
                    result.style.display = 'block';
                } else {
                    result.innerHTML = '❌ Error: ' + JSON.stringify(data);
                    result.style.display = 'block';
                }
                
            } catch (error) {
                console.error('Error:', error);
                result.innerHTML = '❌ Error: ' + error.message;
                result.style.display = 'block';
            } finally {
                btn.disabled = false;
                loading.style.display = 'none';
            }
        }
    </script>
</body>
</html>
