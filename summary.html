<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free AI Summary Generator | FreeToolsIndia</title>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
        }
        
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        h1 {
            text-align: center;
            color: #6366f1;
        }
        
        textarea {
            width: 100%;
            height: 200px;
            padding: 15px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 15px;
            margin: 15px 0;
            box-sizing: border-box;
        }
        
        select, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 2px solid #e5e7eb;
            font-size: 15px;
            box-sizing: border-box;
        }
        
        button {
            background: #6366f1;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 18px;
        }
        
        button:hover {
            background: #4f46e5;
        }
        
        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }
        
        #result {
            margin-top: 20px;
            padding: 20px;
            background: #f9fafb;
            border-radius: 10px;
            display: none;
            white-space: pre-wrap;
            line-height: 1.6;
        }
        
        .loading {
            text-align: center;
            color: #6366f1;
            display: none;
            margin: 15px 0;
        }
        
        .error {
            color: red;
            padding: 10px;
            background: #fee;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 AI Summary Generator</h1>
        
        <label>Summary Format:</label>
        <select id="format">
            <option value="Bullet Points">Bullet Points</option>
            <option value="Paragraph">Paragraph</option>
            <option value="Key Takeaways">Key Takeaways</option>
            <option value="Executive Summary">Executive Summary</option>
        </select>
        
        <label>Language:</label>
        <select id="language">
            <option value="English">English</option>
            <option value="Hindi">Hindi</option>
            <option value="Hinglish">Hinglish</option>
        </select>
        
        <label>Your Text:</label>
        <textarea id="inputText" placeholder="Paste your text here..."></textarea>
        
        <button id="generateBtn" onclick="generateSummary()">🚀 Generate Summary</button>
        
        <div class="loading" id="loading">⏳ Generating... Please wait...</div>
        
        <div id="result"></div>
        
        <a href="index.html" style="display:block; text-align:center; margin-top:20px;">← Back to Home</a>
    </div>

    <script>
        async function generateSummary() {
            // Get values
            var text = document.getElementById('inputText').value;
            var format = document.getElementById('format').value;
            var language = document.getElementById('language').value;
            
            var result = document.getElementById('result');
            var loading = document.getElementById('loading');
            var btn = document.getElementById('generateBtn');
            
            // Validation
            if (!text || text.length < 50) {
                alert('Please paste at least 50 characters of text.');
                return;
            }
            
            // Show loading
            btn.disabled = true;
            loading.style.display = 'block';
            result.style.display = 'none';
            
            // Create prompt
            var prompt = 'Summarize this text in ' + format + ' format.\n' +
                         'Language: ' + language + '\n\n' +
                         'Text: ' + text;
            
            console.log('Sending request to API...');
            
            try {
                // DIRECT API CALL - No callAI function
                var response = await fetch('/api/groq', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        prompt: prompt,
                        systemPrompt: 'You are a professional summarizer. Create clear and accurate summaries.',
                        maxTokens: 1000
                    })
                });
                
                console.log('Response status:', response.status);
                
                if (!response.ok) {
                    throw new Error('HTTP Error: ' + response.status);
                }
                
                var data = await response.json();
                console.log('API Response:', data);
                
                // Extract content
                var content = '';
                if (data.choices && data.choices[0] && data.choices[0].message) {
                    content = data.choices[0].message.content;
                } else if (data.error) {
                    throw new Error(data.error);
                } else {
                    throw new Error('Invalid response format');
                }
                
                // Show result
                result.innerHTML = '<h3>✅ Summary:</h3><br>' + content.replace(/\n/g, '<br>');
                result.style.display = 'block';
                
            } catch (error) {
                console.error('Error:', error);
                result.innerHTML = '<div class="error">❌ Error: ' + error.message + '</div>';
                result.style.display = 'block';
            } finally {
                btn.disabled = false;
                loading.style.display = 'none';
            }
        }
    </script>
</body>
</html>
