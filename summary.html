<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Summary Generator - Free Tools India</title>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
        }
        h1 {
            text-align: center;
            color: #6366f1;
        }
        select, textarea, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
        }
        textarea {
            height: 150px;
        }
        button {
            background: #6366f1;
            color: white;
            border: none;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
        button:disabled {
            background: #9ca3af;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            background: #f9fafb;
            border-radius: 8px;
            display: none;
            line-height: 1.6;
        }
        #loading {
            display: none;
            text-align: center;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 AI Summary Generator</h1>
        
        <label>Format:</label>
        <select id="format">
            <option>Bullet Points</option>
            <option>Paragraph</option>
            <option>Key Takeaways</option>
            <option>Executive Summary</option>
        </select>
        
        <label>Language:</label>
        <select id="language">
            <option>English</option>
            <option>Hindi</option>
            <option>Hinglish</option>
        </select>
        
        <label>Paste Text:</label>
        <textarea id="inputText" placeholder="Paste your text here (minimum 50 characters)..."></textarea>
        
        <button id="btn" onclick="generate()">🚀 Generate Summary</button>
        
        <div id="loading">⏳ Generating...</div>
        <div id="result"></div>
    </div>

    <script>
    async function generate() {
        var text = document.getElementById('inputText').value;
        var format = document.getElementById('format').value;
        var language = document.getElementById('language').value;
        var btn = document.getElementById('btn');
        var loading = document.getElementById('loading');
        var result = document.getElementById('result');
        
        if (text.length < 50) {
            alert('Please paste at least 50 characters');
            return;
        }
        
        btn.disabled = true;
        loading.style.display = 'block';
        result.style.display = 'none';
        
        var prompt = 'Summarize in ' + format + ' format, language: ' + language + '\n\nText: ' + text;
        
        try {
            // DIRECT GROQ API CALL - No Vercel API needed
            var response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer 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'
                },
                body: JSON.stringify({
                    model: 'mixtral-8x7b-32768',
                    messages: [
                        { role: 'system', content: 'You are a professional summarizer.' },
                        { role: 'user', content: prompt }
                    ],
                    max_tokens: 1000
                })
            });
            
            var data = await response.json();
            console.log('API Response:', data);
            
            if (data.choices && data.choices[0]) {
                result.innerHTML = '<h3>✅ Summary:</h3>' + 
                                  data.choices[0].message.content.replace(/\n/g, '<br>');
                result.style.display = 'block';
            } else {
                result.innerHTML = 'Error: ' + JSON.stringify(data);
                result.style.display = 'block';
            }
            
        } catch (e) {
            result.innerHTML = 'Error: ' + e.message;
            result.style.display = 'block';
        }
        
        btn.disabled = false;
        loading.style.display = 'none';
    }
    </script>
</body>
</html>
