<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback - FreeToolsIndia</title>
    <meta name="description" content="Share your feedback about FreeToolsIndia. Help us improve our free AI tools.">
    <meta name="robots" content="index, follow">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #6366f1;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .header p {
            color: #6b7280;
        }

        select, textarea {
            width: 100%;
            padding: 12px 15px;
            font-size: 16px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            margin-bottom: 15px;
            transition: border-color 0.3s;
        }

        select:focus, textarea:focus {
            outline: none;
            border-color: #6366f1;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        .rating-container {
            text-align: center;
            margin-bottom: 20px;
        }

        .rating-container p {
            margin-bottom: 10px;
            font-weight: 600;
            color: #374151;
        }

        .stars {
            font-size: 2.5rem;
            cursor: pointer;
        }

        .star {
            transition: transform 0.2s;
            display: inline-block;
        }

        .star:hover {
            transform: scale(1.3);
        }

        .btn {
            background: linear-gradient(45deg, #6366f1, #8b5cf6);
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: transform 0.3s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #6366f1;
            text-decoration: none;
            font-weight: 500;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .success-message {
            display: none;
            background: #10b981;
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-top: 20px;
        }

        .error-message {
            display: none;
            background: #ef4444;
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-top: 20px;
        }

        .loading {
            display: none;
            text-align: center;
            color: #6366f1;
            margin: 15px 0;
        }

        footer {
            text-align: center;
            margin-top: 30px;
            color: #6b7280;
            font-size: 14px;
        }

        footer a {
            color: #6366f1;
            text-decoration: none;
            margin: 0 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⭐ Feedback</h1>
            <p>Help us improve our free tools</p>
        </div>

        <select id="toolName">
            <option value="summary">📝 Summary Generator</option>
            <option value="resume">💼 Resume Builder</option>
            <option value="excel">📊 Excel Formula Generator</option>
            <option value="writer">✍️ Article Writer</option>
            <option value="email">📧 Email Writer</option>
            <option value="social">📱 Social Media Post Generator</option>
        </select>

        <div class="rating-container">
            <p>Rate your experience:</p>
            <div class="stars">
                <span class="star" onclick="setRating(1)">⭐</span>
                <span class="star" onclick="setRating(2)">⭐</span>
                <span class="star" onclick="setRating(3)">⭐</span>
                <span class="star" onclick="setRating(4)">⭐</span>
                <span class="star" onclick="setRating(5)">⭐</span>
            </div>
            <input type="hidden" id="rating" value="5">
            <p id="ratingText" style="font-size: 14px; color: #6366f1;">Excellent! ⭐⭐⭐⭐⭐</p>
        </div>

        <textarea id="message" rows="5" placeholder="Write your feedback here..."></textarea>

        <button class="btn" id="submitBtn" onclick="submitFeedback()">Submit Feedback</button>

        <div class="loading" id="loading">⏳ Saving your feedback...</div>
        <div class="success-message" id="successMessage">✅ Thank you for your feedback!</div>
        <div class="error-message" id="errorMessage">❌ Error saving feedback. Please try again.</div>

        <footer>
            <a href="index.html">Home</a> |
            <a href="contact.html">Contact</a> |
            <a href="privacy-policy.html">Privacy</a>
        </footer>

        <a href="index.html" class="back-link">← Back to Home</a>
    </div>

    <script>
        function setRating(stars) {
            document.getElementById('rating').value = stars;
            
            var allStars = document.querySelectorAll('.star');
            allStars.forEach(function(star, index) {
                if (index < stars) {
                    star.style.opacity = '1';
                } else {
                    star.style.opacity = '0.3';
                }
            });
            
            var ratings = ['Poor 😞', 'Fair 😐', 'Good 🙂', 'Very Good 😊', 'Excellent! ⭐⭐⭐⭐⭐'];
            document.getElementById('ratingText').textContent = ratings[stars - 1];
        }

        async function submitFeedback() {
            var toolName = document.getElementById('toolName').value;
            var rating = parseInt(document.getElementById('rating').value);
            var message = document.getElementById('message').value;
            
            var btn = document.getElementById('submitBtn');
            var loading = document.getElementById('loading');
            
            if (!message) {
                alert('Please write your feedback!');
                return;
            }
            
            btn.disabled = true;
            loading.style.display = 'block';
            document.getElementById('successMessage').style.display = 'none';
            document.getElementById('errorMessage').style.display = 'none';
            
            try {
                // Direct Supabase API call
                const response = await fetch('https://ibosfyljujpwsyyjdurl.supabase.co/rest/v1/feedback', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': 'sb_publishable_XF-3E1hw8_84grRf2Kl3zQ_J4kc0ENc',
                        'Authorization': 'Bearer sb_publishable_XF-3E1hw8_84grRf2Kl3zQ_J4kc0ENc',
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify({
                        tool_name: toolName,
                        rating: rating,
                        message: message
                    })
                });
                
                if (response.ok) {
                    loading.style.display = 'none';
                    document.getElementById('successMessage').style.display = 'block';
                    document.getElementById('message').value = '';
                    
                    setTimeout(function() {
                        document.getElementById('successMessage').style.display = 'none';
                    }, 3000);
                } else {
                    throw new Error('Save failed');
                }
                
            } catch (error) {
                loading.style.display = 'none';
                document.getElementById('errorMessage').style.display = 'block';
                console.error('Feedback Error:', error);
            } finally {
                btn.disabled = false;
            }
        }

        // Initialize stars
        setRating(5);
    </script>
</body>
</html>
