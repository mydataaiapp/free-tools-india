<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - FreeToolsIndia</title>
    <meta name="description" content="Contact FreeToolsIndia for support, feedback, or business inquiries. We're here to help with our free AI tools.">
    <meta name="robots" content="index, follow">
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #6366f1;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p {
            color: #6b7280;
        }

        .contact-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .contact-card {
            background: #f9fafb;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            transition: all 0.3s;
        }

        .contact-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .contact-card .icon {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .contact-card h3 {
            font-size: 1rem;
            margin-bottom: 5px;
            color: #374151;
        }

        .contact-card p {
            font-size: 0.9rem;
            color: #6b7280;
        }

        .contact-card a {
            color: #6366f1;
            text-decoration: none;
            font-weight: 600;
        }

        .contact-card a:hover {
            text-decoration: underline;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
        }

        input, textarea {
            width: 100%;
            padding: 12px 15px;
            font-size: 15px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        textarea {
            height: 150px;
            resize: vertical;
        }

        .btn {
            background: linear-gradient(45deg, #6366f1, #8b5cf6);
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: transform 0.3s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #6366f1;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .success-message {
            display: none;
            background: #10b981;
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-top: 15px;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .social-link {
            width: 50px;
            height: 50px;
            background: #eef2ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            transition: all 0.3s;
            text-decoration: none;
        }

        .social-link:hover {
            background: #6366f1;
            transform: translateY(-5px);
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            
            .header h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📧 Contact Us</h1>
            <p>We're here to help! Reach out anytime.</p>
        </div>

        <div class="contact-info">
            <div class="contact-card">
                <div class="icon">📧</div>
                <h3>Email Us</h3>
                <p><a href="mailto:support@freetoolsindia.com">support@freetoolsindia.com</a></p>
            </div>
            <div class="contact-card">
                <div class="icon">💼</div>
                <h3>Business Inquiries</h3>
                <p><a href="mailto:business@freetoolsindia.com">business@freetoolsindia.com</a></p>
            </div>
            <div class="contact-card">
                <div class="icon">⭐</div>
                <h3>Feedback</h3>
                <p><a href="feedback.html">Submit Feedback</a></p>
            </div>
        </div>

        <h2 style="color: #374151; margin-bottom: 20px; text-align: center;">Send Us a Message</h2>

        <div class="form-group">
            <label>Your Name *</label>
            <input type="text" id="name" placeholder="e.g., Rahul Sharma">
        </div>

        <div class="form-group">
            <label>Your Email *</label>
            <input type="email" id="email" placeholder="e.g., rahul@gmail.com">
        </div>

        <div class="form-group">
            <label>Subject *</label>
            <input type="text" id="subject" placeholder="e.g., Suggestion for new tool">
        </div>

        <div class="form-group">
            <label>Message *</label>
            <textarea id="message" placeholder="Write your message here..."></textarea>
        </div>

        <button class="btn" onclick="sendMessage()">Send Message</button>

        <div class="success-message" id="successMessage">
            ✅ Thank you! Your message has been sent.
        </div>

        <div class="social-links">
            <a href="#" class="social-link" title="Facebook">📘</a>
            <a href="#" class="social-link" title="Twitter">🐦</a>
            <a href="#" class="social-link" title="Instagram">📸</a>
            <a href="#" class="social-link" title="LinkedIn">💼</a>
        </div>

        <a href="index.html" class="back-link">← Back to Home</a>
    </div>

    <script>
        function sendMessage() {
            var name = document.getElementById('name').value;
            var email = document.getElementById('email').value;
            var subject = document.getElementById('subject').value;
            var message = document.getElementById('message').value;
            
            if (!name || !email || !subject || !message) {
                alert('Please fill in all fields.');
                return;
            }
            
            // Simple email validation
            var emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                alert('Please enter a valid email address.');
                return;
            }
            
            // For now, show success message
            // Later, connect to Supabase or email service
            document.getElementById('successMessage').style.display = 'block';
            
            // Clear form
            document.getElementById('name').value = '';
            document.getElementById('email').value = '';
            document.getElementById('subject').value = '';
            document.getElementById('message').value = '';
            
            setTimeout(function() {
                document.getElementById('successMessage').style.display = 'none';
            }, 5000);
        }
    </script>
</body>
</html>
